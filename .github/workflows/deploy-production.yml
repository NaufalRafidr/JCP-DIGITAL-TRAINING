name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VPS_PORT: 22
  VPS_HOST: 103.103.23.46
  VPS_USER: jogjacreativepro
  VPS_APP_PATH: /home/jogjacreativepro/jcpdigitaltraining
  APP_URL: https://jcpdigitaltraining.duckdns.org

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jcpdigitaltraining.duckdns.org

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          test -n "$VPS_SSH_KEY" || { echo "Secret VPS_SSH_KEY belum diatur." >&2; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          # Buang CR (Windows), dukung secret yang tersimpan dengan "\n" literal,
          # dan pastikan file diakhiri tepat satu newline (wajib untuk OpenSSH).
          key="${VPS_SSH_KEY//$'\r'/}"
          if [[ "$key" != *$'\n'* && "$key" == *'\n'* ]]; then
            key="${key//\\n/$'\n'}"
          fi
          key="$(printf '%s' "$key")"
          printf '%s\n' "$key" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/deploy_key" > /dev/null; then
            echo "Private key tidak valid. Baris pertama: $(head -n 1 "$HOME/.ssh/deploy_key" | cut -c1-40)" >&2
            echo "Jumlah baris: $(wc -l < "$HOME/.ssh/deploy_key")" >&2
            echo "Pastikan secret berisi private key OpenSSH/PEM utuh tanpa passphrase (bukan .ppk / public key)." >&2
            exit 1
          fi
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Package source
        shell: bash
        run: |
          set -Eeuo pipefail

          tar -czf "$RUNNER_TEMP/jcpdigitaltraining-release.tar.gz" \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./vendor' \
            --exclude='./node_modules' \
            --exclude='./storage' \
            --exclude='./public/build' \
            --exclude='./public/storage' \
            --exclude='./tests' \
            .

      - name: Upload source to VPS
        shell: bash
        run: |
          set -Eeuo pipefail

          scp -P "$VPS_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            "$RUNNER_TEMP/jcpdigitaltraining-release.tar.gz" \
            "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/.github-release.tar.gz"

      - name: Build and restart Docker services
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh -p "$VPS_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            "$VPS_USER@$VPS_HOST" \
            "APP_PATH='$VPS_APP_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          stage="$(mktemp -d /tmp/jcpdigitaltraining-deploy-XXXXXX)"
          release="$APP_PATH/.github-release.tar.gz"

          cleanup() {
              rm -rf "$stage" "$release"
          }
          trap cleanup EXIT

          test -d "$APP_PATH"
          test -f "$APP_PATH/.env.production"
          tar -xzf "$release" -C "$stage"
          cp -a "$stage"/. "$APP_PATH"/

          cd "$APP_PATH"
          compose=(docker compose --env-file .env.production -f docker-compose.production.yml)

          "${compose[@]}" up -d --build app scheduler
          "${compose[@]}" exec -T app sh -lc '
              mkdir -p storage/app/public
              if [ ! -e public/storage ] && [ ! -L public/storage ]; then
                  php artisan storage:link
              fi
              test -L public/storage
              chown -R www-data:www-data storage/app/public
          '
          "${compose[@]}" exec -T app php artisan migrate --force
          "${compose[@]}" exec -T app php artisan db:seed --class=DummyScheduleSeeder --force
          "${compose[@]}" exec -T app php artisan optimize:clear
          "${compose[@]}" ps
          REMOTE

      - name: Verify production URL
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --head "$APP_URL"

      - name: Publish deployment summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deployment ${JOB_STATUS}"
            echo
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Environment: \`production\`"
            echo "- URL: ${APP_URL}"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"
