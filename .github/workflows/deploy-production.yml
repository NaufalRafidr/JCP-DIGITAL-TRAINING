name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VPS_PORT: 22
  VPS_APP_PATH: /home/jogjacreativepro/jcpdigitaltraining
  APP_URL: https://jcpdigitaltraining.duckdns.org

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jcpdigitaltraining.duckdns.org

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          test -n "$VPS_HOST" || { echo "Secret VPS_HOST belum diatur." >&2; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Secret VPS_SSH_KEY belum diatur." >&2; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Package source
        shell: bash
        run: |
          set -Eeuo pipefail

          tar -czf "$RUNNER_TEMP/jcpdigitaltraining-release.tar.gz" \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./vendor' \
            --exclude='./node_modules' \
            --exclude='./storage' \
            --exclude='./public/build' \
            --exclude='./public/storage' \
            --exclude='./tests' \
            .

      - name: Upload source to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          test -n "$VPS_USER" || { echo "Secret VPS_USER belum diatur." >&2; exit 1; }
          scp -P "$VPS_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            "$RUNNER_TEMP/jcpdigitaltraining-release.tar.gz" \
            "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/.github-release.tar.gz"

      - name: Build and restart Docker services
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail

          ssh -p "$VPS_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            "$VPS_USER@$VPS_HOST" \
            "APP_PATH='$VPS_APP_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          stage="$(mktemp -d /tmp/jcpdigitaltraining-deploy-XXXXXX)"
          release="$APP_PATH/.github-release.tar.gz"

          cleanup() {
              rm -rf "$stage" "$release"
          }
          trap cleanup EXIT

          test -d "$APP_PATH"
          test -f "$APP_PATH/.env.production"
          tar -xzf "$release" -C "$stage"
          cp -a "$stage"/. "$APP_PATH"/

          cd "$APP_PATH"
          compose=(docker compose --env-file .env.production -f docker-compose.production.yml)

          "${compose[@]}" up -d --build app scheduler
          "${compose[@]}" exec -T app php artisan migrate --force
          "${compose[@]}" exec -T app php artisan optimize:clear
          "${compose[@]}" ps
          REMOTE

      - name: Verify production URL
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --head "$APP_URL"

      - name: Publish deployment summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deployment ${JOB_STATUS}"
            echo
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Environment: \`production\`"
            echo "- URL: ${APP_URL}"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"
